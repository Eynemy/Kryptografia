<!DOCTYPE html>
<html>
<head>
<style>
  .red-background {
    padding-top: 200px;
    background-color: red;
    position: relative;
    height: 200px;
    width: 200px;
  }

  .black-overlay {
    background-color: rgba(0, 0, 0, 0.9);
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
  }
</style>
</head>
<body>

<div class="red-background">
  <div class="black-overlay"></div>
</div>

</body>
</html>
